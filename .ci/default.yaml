# Imported from .github/workflows/lint-test.yml by `modernci import github` and hand-completed:
# the setup-helm / chart-testing / kind actions are written out as pinned downloads.
to: dev
on:
  move: [lint-test]
  push: [lint-test]
  landed: [lint-test]
checks:
  lint-test:
    run: |
      set -eu
      os=$(uname -s | tr A-Z a-z); arch=$(uname -m); case "$arch" in x86_64) arch=amd64;; aarch64) arch=arm64;; esac
      T=${MODERNCI_CACHE_DIR:-$HOME/.cache}/busbar-ci-tools/helm-charts; mkdir -p "$T/bin"
      PATH="$T/bin:$PATH"; export PATH
      HELM=v3.16.3; CT=3.15.0; KIND=v0.33.0; KUBECTL=v1.37.1
      [ -x "$T/bin/helm-$HELM" ] || { curl -fsSL "https://get.helm.sh/helm-$HELM-$os-$arch.tar.gz" | tar -xz -C "$T" "$os-$arch/helm" && mv "$T/$os-$arch/helm" "$T/bin/helm-$HELM"; }
      cp "$T/bin/helm-$HELM" "$T/bin/helm"
      if [ ! -x "$T/ct-$CT/ct" ]; then mkdir -p "$T/ct-$CT"; curl -fsSL "https://github.com/helm/chart-testing/releases/download/v$CT/chart-testing_${CT}_${os}_${arch}.tar.gz" | tar -xz -C "$T/ct-$CT"; fi
      PATH="$T/ct-$CT:$PATH"
      python3 -m venv "$T/venv" && "$T/venv/bin/pip" install -q yamllint==1.33.0 yamale==4.0.4 && PATH="$T/venv/bin:$PATH"
      helm version --short
      # chart-testing compares with the target branch: make sure it is there.
      git fetch -q origin main:refs/remotes/origin/main 2>/dev/null || true
      git fetch -q --unshallow 2>/dev/null || true
      CTARGS="--config ct.yaml --chart-yaml-schema $T/ct-$CT/etc/chart_schema.yaml --lint-conf $T/ct-$CT/etc/lintconf.yaml"
      changed=$(ct list-changed $CTARGS)
      ct lint $CTARGS --check-version-increment=false
      if [ -n "$changed" ]; then
        [ -x "$T/bin/kind" ] || { curl -fsSLo "$T/bin/kind" "https://kind.sigs.k8s.io/dl/$KIND/kind-$os-$arch" && chmod +x "$T/bin/kind"; }
        [ -x "$T/bin/kubectl" ] || { curl -fsSLo "$T/bin/kubectl" "https://dl.k8s.io/release/$KUBECTL/bin/$os/$arch/kubectl" && chmod +x "$T/bin/kubectl"; }
        name=mci-$$
        kind create cluster --name "$name" --wait 120s
        trap 'kind delete cluster --name "$name" || true' EXIT
        # cert-manager + a CA ClusterIssuer named "busbar-ca" so the ci/admin-mtls install test can
        # exercise the exposed-admin-plane mTLS path end to end.
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
        kubectl -n cert-manager wait --for=condition=Available deploy --all --timeout=300s
        kubectl apply -f - <<'YAML'
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata: { name: selfsigned }
      spec: { selfSigned: {} }
      ---
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata: { name: busbar-ca, namespace: cert-manager }
      spec:
        isCA: true
        commonName: busbar-ca
        secretName: busbar-ca
        privateKey: { algorithm: ECDSA, size: 256 }
        issuerRef: { name: selfsigned, kind: ClusterIssuer, group: cert-manager.io }
      ---
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata: { name: busbar-ca }
      spec:
        ca: { secretName: busbar-ca }
      YAML
        kubectl -n cert-manager wait --for=condition=Ready certificate/busbar-ca --timeout=120s
        ct install $CTARGS
      fi
    requires:
    - python3
    - docker
env:
  CI: 'true'
