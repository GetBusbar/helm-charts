apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "busbar.fullname" . }}-test-connection"
  # Not the selector labels: the Deployment's selector is also the HPA's pod
  # selector, and this curl pod (no CPU request) would stall CPU autoscaling.
  labels:
    helm.sh/chart: {{ include "busbar.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: healthz
      image: curlimages/curl:8.11.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command: ["curl"]
      args:
        - "--fail"
        - "--show-error"
        - "--silent"
        # `helm test` can fire before the Service endpoint has propagated, which
        # fails instantly with "Could not connect to server". Retry rather than
        # report a healthy gateway as broken.
        - "--retry"
        - "10"
        - "--retry-delay"
        - "2"
        - "--retry-connrefused"
        - "--retry-all-errors"
        - "--max-time"
        - "60"
        - "{{ if .Values.dataTLS.enabled }}https{{ else }}http{{ end }}://{{ include "busbar.serviceName" (dict "root" . "suffix" "-data") }}:{{ .Values.service.data.port }}/healthz"
        {{- if .Values.dataTLS.enabled }}
        - "--insecure"
        {{- end }}
