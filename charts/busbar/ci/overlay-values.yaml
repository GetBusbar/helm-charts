# CI: configMutability.mode=overlay -- admin-API config mutation re-enabled with
# the overlay backend on the chart's writable /tmp emptyDir. Single replica,
# because a pod-local overlay diverges across replicas.
replicaCount: 1
configMutability:
  mode: overlay
config:
  identity-providers:
    admin-tokens:
      module: admin-tokens
      token:
        env: BUSBAR_ADMIN_TOKEN
  auth:
    chain: []
    admin_auth: [admin-tokens]
  providers:
    anthropic:
      api_key:
        env: ANTHROPIC_KEY
  models:
    claude-sonnet:
      provider: anthropic
      max_concurrent: 20
  pools:
    default:
      members:
        - model: claude-sonnet
secrets:
  create: true
  data:
    ANTHROPIC_KEY: ci-dummy-anthropic-key
    BUSBAR_ADMIN_TOKEN: ci-dummy-admin-token
