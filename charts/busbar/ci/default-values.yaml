# CI: minimal bootable config for the default (stateless Deployment) path.
# busbar 1.5.x syntax: secret references, a pool whose members use `model:`.
# A dummy provider key satisfies the startup check; no upstream is called.
config:
  identity-providers:
    admin-tokens:
      module: admin-tokens
      token:
        env: BUSBAR_ADMIN_TOKEN
  auth:
    chain: []
    admin_auth: [admin-tokens]
  providers:
    anthropic:
      api_key:
        env: ANTHROPIC_KEY
  models:
    claude-sonnet:
      provider: anthropic
      max_concurrent: 20
  pools:
    default:
      members:
        - model: claude-sonnet
secrets:
  create: true
  data:
    ANTHROPIC_KEY: ci-dummy-anthropic-key
    BUSBAR_ADMIN_TOKEN: ci-dummy-admin-token
