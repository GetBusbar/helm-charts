# CI: governance path -- StatefulSet + PVC, requires an admin token. The store
# stays on `memory` because busbar 1.5.3's image ships no signed store plugin.
config:
  auth:
    chain: []
  providers:
    anthropic:
      api_key:
        env: ANTHROPIC_KEY
  models:
    claude-sonnet:
      provider: anthropic
      max_concurrent: 20
  pools:
    default:
      members:
        - model: claude-sonnet
secrets:
  create: true
  data:
    ANTHROPIC_KEY: ci-dummy-anthropic-key
    BUSBAR_ADMIN_TOKEN: ci-dummy-admin-token
governance:
  enabled: true
  persistence:
    size: 1Gi
