# CI: exposed admin plane with cert-manager mTLS. Requires cert-manager + a
# ClusterIssuer named "busbar-ca" in the cluster (the workflow installs both).
config:
  identity-providers:
    admin-tokens:
      module: admin-tokens
      token:
        env: BUSBAR_ADMIN_TOKEN
  auth:
    chain: []
    admin_auth: [admin-tokens]
  providers:
    anthropic:
      api_key:
        env: ANTHROPIC_KEY
  models:
    claude-sonnet:
      provider: anthropic
      max_concurrent: 20
  pools:
    default:
      members:
        - model: claude-sonnet
secrets:
  create: true
  data:
    ANTHROPIC_KEY: ci-dummy-anthropic-key
    BUSBAR_ADMIN_TOKEN: ci-dummy-admin-token
service:
  admin:
    enabled: true
adminTLS:
  enabled: true
  certManager:
    enabled: true
    issuerRef:
      name: busbar-ca
      kind: ClusterIssuer
