name: Lint and Test Charts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        run: ct lint --config ct.yaml --check-version-increment=false

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      # install test can exercise the exposed-admin-plane mTLS path end to end.
      - name: Install cert-manager
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
          kubectl -n cert-manager wait --for=condition=Available deploy --all --timeout=300s

      - name: Create the busbar-ca ClusterIssuer
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata: { name: selfsigned }
          spec: { selfSigned: {} }
          ---
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata: { name: busbar-ca, namespace: cert-manager }
          spec:
            isCA: true
            commonName: busbar-ca
            secretName: busbar-ca
            privateKey: { algorithm: ECDSA, size: 256 }
            issuerRef: { name: selfsigned, kind: ClusterIssuer, group: cert-manager.io }
          ---
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata: { name: busbar-ca }
          spec:
            ca: { secretName: busbar-ca }
          EOF
          kubectl -n cert-manager wait --for=condition=Ready certificate/busbar-ca --timeout=120s

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config ct.yaml
